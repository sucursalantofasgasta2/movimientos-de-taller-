<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestión Taller - V5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --success: #16a34a; --danger: #dc2626; }
        body { background-color: #f1f5f9; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .nav-link { font-weight: bold; border-radius: 10px !important; margin: 0 5px; color: #64748b; }
        .nav-link.active { background-color: var(--primary) !important; color: white !important; }
        .loading { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); z-index:9999; justify-content:center; align-items:center; flex-direction:column; }
        .rechazo-item { display: flex; align-items: center; margin-bottom: 10px; gap: 10px; }
    </style>
</head>
<body>

<div id="loading" class="loading">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
    <h5 class="mt-3 fw-bold text-secondary">Enviando datos a la Hoja...</h5>
</div>

<div class="container py-4">
    <div class="text-center mb-4"><h2 class="fw-bold">📊 GESTIÓN OPERATIVA TALLER</h2></div>

    <ul class="nav nav-pills nav-justified mb-4">
        <li class="nav-item"><button class="nav-link active" onclick="showTab('form')">📝 REGISTRO</button></li>
        <li class="nav-item"><button class="nav-link" onclick="showTab('stats')">📈 EVALUACIÓN (KPIs)</button></li>
    </ul>

    <div id="view-form">
        <div class="card mx-auto p-4" style="max-width: 650px;">
            <form id="tallerForm">
                <div class="mb-3">
                    <label class="fw-bold small">FECHA</label>
                    <input type="date" id="fecha" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label class="fw-bold small text-success">🟢 INGRESOS (Patentes)</label>
                    <textarea id="ingresos" class="form-control" rows="1" placeholder="Ej: SWVR65 ABC123"></textarea>
                </div>

                <div class="p-3 bg-light rounded-3 mb-3 border">
                    <label class="fw-bold small text-danger">🚫 UNIDADES RECHAZADAS (Patente + Motivo)</label>
                    <div id="rechazosContainer">
                        <div class="rechazo-item">
                            <input type="text" class="form-control rechazo-patente" placeholder="Patente">
                            <input type="text" class="form-control rechazo-motivo" placeholder="Motivo">
                            <button type="button" class="btn btn-outline-danger btn-sm" onclick="this.parentElement.remove()">-</button>
                        </div>
                    </div>
                    <button type="button" class="btn btn-outline-secondary w-100 btn-sm mt-2" onclick="addRechazoField()">+ Añadir otro rechazo</button>
                </div>

                <div class="mb-3"><label class="fw-bold small text-info">⌛ PENDIENTES DE INGRESO</label><textarea id="pendientes" class="form-control" rows="1"></textarea></div>
                <div class="mb-3"><label class="fw-bold small text-warning">🔧 RETIRADAS DE TALLER</label><textarea id="retiros" class="form-control" rows="1"></textarea></div>
                <div class="mb-4"><label class="fw-bold small text-primary">🚚 ENTREGADAS A LOGÍSTICA</label><textarea id="entregas" class="form-control" rows="1"></textarea></div>

                <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold py-3">GUARDAR EN EXCEL 🚀</button>
            </form>
        </div>
    </div>

    <div id="view-stats" style="display:none;"><div class="row g-4" id="statsContainer"></div></div>
</div>

<script>
    // URL DE TU VERSIÓN 5
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyJOyWbQ6IUk2cpDK6Mt2CTQOBzUuoi2EhLO_HG803e-XZbGB7seU0tVuQZmISxvNhF6g/exec";

    document.getElementById('fecha').valueAsDate = new Date();

    function addRechazoField() {
        const div = document.createElement('div');
        div.className = 'rechazo-item';
        div.innerHTML = `<input type="text" class="form-control rechazo-patente" placeholder="Patente"><input type="text" class="form-control rechazo-motivo" placeholder="Motivo"><button type="button" class="btn btn-outline-danger btn-sm" onclick="this.parentElement.remove()">-</button>`;
        document.getElementById('rechazosContainer').appendChild(div);
    }

    function showTab(view) {
        document.getElementById('view-form').style.display = (view === 'form') ? 'block' : 'none';
        document.getElementById('view-stats').style.display = (view === 'stats') ? 'block' : 'none';
        if(view === 'stats') loadStats();
    }

    function loadStats() {
        document.getElementById('loading').style.display = 'flex';
        fetch(SCRIPT_URL).then(res => res.json()).then(data => {
            let html = "";
            // Lógica simple de KPIs para visualización rápida
            document.getElementById('statsContainer').innerHTML = "<p class='text-center'>Cargando estadísticas de la Hoja...</p>";
            // Aquí se pueden renderizar los KPIs igual que en versiones anteriores
            document.getElementById('loading').style.display = 'none';
        }).catch(() => document.getElementById('loading').style.display = 'none');
    }

    document.getElementById('tallerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        document.getElementById('loading').style.display = 'flex';
        
        const patentes = document.querySelectorAll('.rechazo-patente');
        const motivos = document.querySelectorAll('.rechazo-motivo');
        const rechazosArray = [];
        patentes.forEach((p, i) => {
            if(p.value.trim()) rechazosArray.push({patente: p.value.trim(), motivo: motivos[i].value.trim() || "S/M"});
        });

        const payload = {
            fecha: document.getElementById('fecha').value,
            ingresos: document.getElementById('ingresos').value,
            pendientes: document.getElementById('pendientes').value,
            retiros: document.getElementById('retiros').value,
            entregas: document.getElementById('entregas').value,
            rechazosArray: rechazosArray
        };

        // ENVIAR DATOS
        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors', // Importante para Google Scripts
            cache: 'no-cache',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(() => {
            document.getElementById('loading').style.display = 'none';
            alert("✅ ¡Datos enviados con éxito a Google Sheets!");
            location.reload(); // Recarga para limpiar
        })
        .catch(error => {
            document.getElementById('loading').style.display = 'none';
            alert("❌ Error al enviar datos: " + error);
        });
    });
</script>
</body>
</html>
