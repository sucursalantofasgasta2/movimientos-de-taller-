<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Gestión Taller - V3</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary: #2563eb; --success: #16a34a; --warning: #ca8a04; --danger: #dc2626; --info: #0891b2; }
        body { background-color: #f1f5f9; font-family: 'Segoe UI', sans-serif; }
        .card { border: none; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .nav-link { font-weight: bold; border-radius: 10px !important; margin: 0 5px; color: #64748b; }
        .nav-link.active { background-color: var(--primary) !important; color: white !important; }
        .loading { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); z-index:9999; justify-content:center; align-items:center; flex-direction:column; }
        .rechazo-item { display: flex; align-items: center; margin-bottom: 10px; gap: 10px; }
        .stat-card { border-left: 5px solid var(--primary); }
    </style>
</head>
<body>

<div id="loading" class="loading">
    <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
    <h5 class="mt-3 fw-bold text-secondary">Sincronizando con la Versión 3...</h5>
</div>

<div class="container py-4">
    <div class="text-center mb-4">
        <h2 class="fw-bold">🚀 DASHBOARD GESTIÓN TALLER</h2>
    </div>

    <ul class="nav nav-pills nav-justified mb-4">
        <li class="nav-item"><button class="nav-link active" onclick="showTab('form')">📝 REGISTRO DIARIO</button></li>
        <li class="nav-item"><button class="nav-link" onclick="showTab('stats')">📈 EVALUACIÓN (KPIs)</button></li>
    </ul>

    <div id="view-form">
        <div class="card mx-auto p-4" style="max-width: 650px;">
            <form id="tallerForm">
                <div class="mb-3">
                    <label class="fw-bold small text-uppercase">Fecha</label>
                    <input type="date" id="fecha" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label class="fw-bold small text-success text-uppercase">🟢 Ingresos (Patentes)</label>
                    <textarea id="ingresos" class="form-control" rows="1" placeholder="SWVR65, ABC123..."></textarea>
                </div>

                <div class="p-3 bg-light rounded-3 mb-3 border">
                    <label class="fw-bold small text-danger text-uppercase">🚫 Unidades Rechazadas</label>
                    <div id="rechazosContainer">
                        <div class="rechazo-item">
                            <input type="text" class="form-control rechazo-patente" placeholder="Patente">
                            <input type="text" class="form-control rechazo-motivo" placeholder="Motivo (Ej: Testigos)">
                            <button type="button" class="btn btn-outline-danger btn-sm" onclick="this.parentElement.remove()">-</button>
                        </div>
                    </div>
                    <button type="button" class="btn btn-outline-secondary w-100 btn-sm mt-2" onclick="addRechazoField()">+ Añadir otro rechazo</button>
                </div>

                <div class="mb-3">
                    <label class="fw-bold small text-info text-uppercase">⌛ Pendientes de Ingreso</label>
                    <textarea id="pendientes" class="form-control" rows="1"></textarea>
                </div>

                <div class="mb-3">
                    <label class="fw-bold small text-warning text-uppercase">🔧 Retiradas de Taller</label>
                    <textarea id="retiros" class="form-control" rows="1"></textarea>
                </div>

                <div class="mb-4">
                    <label class="fw-bold small text-primary text-uppercase">🚚 Entregadas a Logística</label>
                    <textarea id="entregas" class="form-control" rows="1"></textarea>
                </div>

                <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold shadow py-3">GUARDAR Y ACTUALIZAR 🚀</button>
            </form>
        </div>
    </div>

    <div id="view-stats" style="display:none;">
        <div class="row g-4" id="statsContainer"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz2JBwXj2Mc-VowVu3tLR6XyG0HHFqy1CRNRFGe8sG0gLvRMyiwD1F7qBOe_OjxjAHr9g/exec";

    document.getElementById('fecha').valueAsDate = new Date();

    function addRechazoField() {
        const div = document.createElement('div');
        div.className = 'rechazo-item';
        div.innerHTML = `<input type="text" class="form-control rechazo-patente" placeholder="Patente">
                         <input type="text" class="form-control rechazo-motivo" placeholder="Motivo">
                         <button type="button" class="btn btn-outline-danger btn-sm" onclick="this.parentElement.remove()">-</button>`;
        document.getElementById('rechazosContainer').appendChild(div);
    }

    function showTab(view) {
        document.getElementById('view-form').style.display = (view === 'form') ? 'block' : 'none';
        document.getElementById('view-stats').style.display = (view === 'stats') ? 'block' : 'none';
        if(view === 'stats') loadStats();
    }

    function loadStats() {
        document.getElementById('loading').style.display = 'flex';
        fetch(SCRIPT_URL).then(res => res.json()).then(data => {
            renderKPIs(data);
            document.getElementById('loading').style.display = 'none';
        });
    }

    function renderKPIs(data) {
        let stats = {};
        for(let i=1; i < data.length; i++) {
            let f = new Date(data[i][0]).toLocaleDateString();
            let cat = data[i][1];
            if(!stats[f]) stats[f] = {ing:0, ret:0, rech:0, pend:0, log:0};
            if(cat === "INGRESO") stats[f].ing++;
            if(cat === "RETIRADA DE TALLER") stats[f].ret++;
            if(cat === "RECHAZADA") stats[f].rech++;
            if(cat === "PENDIENTE DE INGRESO") stats[f].pend++;
            if(cat === "ENTREGADA A LOGÍSTICA") stats[f].log++;
        }
        let html = "";
        Object.keys(stats).reverse().forEach(fecha => {
            let d = stats[fecha];
            html += `<div class="col-md-6 col-lg-4"><div class="card p-3 stat-card h-100">
                <h6 class="fw-bold text-center border-bottom pb-2">${fecha}</h6>
                <div class="small d-flex justify-content-between my-1">Ingresos: <b>${d.ing}</b></div>
                <div class="small d-flex justify-content-between my-1">Rechazos: <b>${d.rech}</b></div>
                <div class="small d-flex justify-content-between my-1">Retiros: <b>${d.ret}</b></div>
                <div class="small d-flex justify-content-between my-1">Logística: <b>${d.log}</b></div>
            </div></div>`;
        });
        document.getElementById('statsContainer').innerHTML = html || "Sin datos.";
    }

    document.getElementById('tallerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        document.getElementById('loading').style.display = 'flex';
        
        const patentes = document.querySelectorAll('.rechazo-patente');
        const motivos = document.querySelectorAll('.rechazo-motivo');
        const rechazosArray = [];
        patentes.forEach((p, i) => {
            if(p.value.trim()) rechazosArray.push({patente: p.value.trim(), motivo: motivos[i].value.trim() || "S/M"});
        });

        const payload = {
            fecha: document.getElementById('fecha').value,
            ingresos: document.getElementById('ingresos').value,
            pendientes: document.getElementById('pendientes').value,
            retiros: document.getElementById('retiros').value,
            entregas: document.getElementById('entregas').value,
            rechazosArray: rechazosArray
        };

        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
        .then(() => {
            document.getElementById('loading').style.display = 'none';
            alert("✅ ¡Datos guardados en Versión 3!");
            location.reload();
        });
    });
</script>
</body>
</html>

</body>
</html>
