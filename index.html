<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Taller Profesional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary: #1a73e8; --bg: #f4f7f6; }
        body { background-color: var(--bg); font-family: 'Segoe UI', sans-serif; }
        .card { border-radius: 12px; border: none; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .nav-pills .nav-link.active { background-color: var(--primary); border-radius: 20px; }
        .stat-table th { background: #f8f9fa; font-size: 0.75rem; text-align: center; color: #5f6368; }
        .stat-table td { text-align: center; font-weight: bold; font-size: 0.9rem; }
        .loading { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); z-index:9999; justify-content:center; align-items:center; flex-direction:column; }
        .btn-remove { color: #dc3545; cursor: pointer; font-weight: bold; border: none; background: none; }
    </style>
</head>
<body>

<div id="loading" class="loading">
    <div class="spinner-border text-primary"></div>
    <h5 class="mt-3 text-secondary">Actualizando Dashboard...</h5>
</div>

<div class="container py-4">
    <h2 class="text-center fw-bold mb-4 text-dark">CONTROL DE MOVIMIENTOS</h2>

    <ul class="nav nav-pills nav-justified mb-4 bg-white p-2 rounded-pill shadow-sm">
        <li class="nav-item"><a class="nav-link active" id="tab-reg" onclick="showTab('form')">📝 REGISTRO</a></li>
        <li class="nav-item"><a class="nav-link" id="tab-stat" onclick="showTab('stats')">📊 ESTADÍSTICAS</a></li>
    </ul>

    <div id="view-form">
        <div class="card p-4 mx-auto" style="max-width: 600px;">
            <form id="tallerForm">
                <div class="mb-3">
                    <label class="form-label fw-bold small">FECHA REPORTE</label>
                    <input type="date" id="fecha" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold text-success small">🟢 INGRESOS A TALLER</label>
                    <textarea id="ingresos" class="form-control" rows="2" placeholder="Patentes..."></textarea>
                </div>
                <div class="p-3 bg-light rounded mb-3 border-start border-danger border-4">
                    <label class="form-label fw-bold text-danger small">🚫 RECHAZOS</label>
                    <div id="rechazosContainer">
                        <div class="row g-2 mb-2 align-items-center rechazo-row">
                            <div class="col-5"><input type="text" class="form-control rechazo-patente" placeholder="Patente"></div>
                            <div class="col-6"><input type="text" class="form-control rechazo-motivo" placeholder="Motivo"></div>
                            <div class="col-1"><button type="button" class="btn-remove" onclick="removeRechazo(this)">✕</button></div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-danger w-100 mt-2" onclick="addRechazo()">+ Agregar otro rechazo</button>
                </div>
                <div class="mb-3"><label class="form-label fw-bold text-info small">⌛ PENDIENTES DE INGRESO</label><textarea id="pendientes" class="form-control" rows="1"></textarea></div>
                <div class="mb-3"><label class="form-label fw-bold text-warning small">🔧 RETIRADAS DE TALLER</label><textarea id="retiros" class="form-control" rows="1"></textarea></div>
                <div class="mb-4"><label class="form-label fw-bold text-primary small">🚚 ENTREGADAS A LOGISTICA</label><textarea id="entregas" class="form-control" rows="1"></textarea></div>
                
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow">ENVIAR REPORTE DE MOVIMIENTOS 🚀</button>
            </form>
        </div>
    </div>

    <div id="view-stats" style="display:none;">
        <div class="card mb-4 overflow-hidden">
            <div class="card-header bg-dark text-white fw-bold small">RESUMEN DE UNIDADES (DIARIO / SEMANAL / MENSUAL)</div>
            <div class="table-responsive">
                <table class="table table-bordered stat-table mb-0">
                    <thead>
                        <tr>
                            <th>CATEGORÍA</th>
                            <th class="table-primary">HOY</th>
                            <th class="table-info">SEMANA</th>
                            <th class="table-warning">MES</th>
                        </tr>
                    </thead>
                    <tbody id="stats-body-comparison"></tbody>
                </table>
            </div>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-6" id="efec-semanal"></div>
            <div class="col-md-6" id="efec-mensual"></div>
        </div>

        <h5 class="fw-bold mb-3 mt-4 small">📋 DETALLE POR DÍA</h5>
        <div id="container-diario"></div>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxrax2C3Iz-1kotxmv4SR3tZ74gLvaqIXrnQC_fbH42cFYWV28YjyNU7w53tF5FQW4O3w/exec";

    document.getElementById('fecha').valueAsDate = new Date();

    function addRechazo() {
        const div = document.createElement('div');
        div.className = 'row g-2 mb-2 align-items-center rechazo-row';
        div.innerHTML = '<div class="col-5"><input type="text" class="form-control rechazo-patente" placeholder="Patente"></div><div class="col-6"><input type="text" class="form-control rechazo-motivo" placeholder="Motivo"></div><div class="col-1"><button type="button" class="btn-remove" onclick="removeRechazo(this)">✕</button></div>';
        document.getElementById('rechazosContainer').appendChild(div);
    }

    function removeRechazo(btn) {
        btn.closest('.rechazo-row').remove();
    }

    function showTab(tab) {
        document.getElementById('view-form').style.display = tab === 'form' ? 'block' : 'none';
        document.getElementById('view-stats').style.display = tab === 'stats' ? 'block' : 'none';
        document.getElementById('tab-reg').classList.toggle('active', tab === 'form');
        document.getElementById('tab-stat').classList.toggle('active', tab === 'stats');
        if(tab === 'stats') loadData();
    }

    function loadData() {
        document.getElementById('loading').style.display = 'flex';
        fetch(SCRIPT_URL).then(r => r.json()).then(rows => {
            renderDashboard(rows);
            document.getElementById('loading').style.display = 'none';
        });
    }

    function renderDashboard(rows) {
        let totalDays = new Set();
        let monthDays = new Set();
        let hoyStr = new Date().toLocaleDateString();
        const hoy = new Date();
        const mesActual = hoy.getMonth();
        const inicioSemana = new Date(hoy); 
        inicioSemana.setDate(hoy.getDate() - (hoy.getDay() || 7) + 1);

        const cats = ["INGRESOS A TALLER", "RECHAZOS", "PENDIENTES DE INGRESO", "RETIRADAS DE TALLER", "ENTREGADAS A LOGISTICA"];
        let counts = {};
        cats.forEach(c => counts[c] = { hoy: 0, sem: 0, mes: 0 });
        let dailyGroup = {};

        for(let i=1; i<rows.length; i++){
            let [f, cat, pat, nota] = rows[i];
            if(!f) continue;
            let fechaRow = new Date(f);
            let dateStr = fechaRow.toLocaleDateString();

            if(fechaRow >= inicioSemana) totalDays.add(dateStr);
            if(fechaRow.getMonth() === mesActual) monthDays.add(dateStr);

            if(counts[cat]) {
                if(dateStr === hoyStr) counts[cat].hoy++;
                if(fechaRow >= inicioSemana) counts[cat].sem++;
                if(fechaRow.getMonth() === mesActual) counts[cat].mes++;
            }

            if(!dailyGroup[dateStr]) dailyGroup[dateStr] = { ing:0, rech:0, pend:0, items:[] };
            if(cat === cats[0]) dailyGroup[dateStr].ing++;
            if(cat === cats[1]) dailyGroup[dateStr].rech++;
            if(cat === cats[2]) dailyGroup[dateStr].pend++;
            dailyGroup[dateStr].items.push({cat, pat, nota});
        }

        // Tabla comparativa
        document.getElementById('stats-body-comparison').innerHTML = cats.map(c => `
            <tr><td class="text-start ps-3 small">${c}</td><td>${counts[c].hoy}</td><td>${counts[c].sem}</td><td>${counts[c].mes}</td></tr>
        `).join('');

        // Efectividad Semanal y Mensual
        let efSem = Math.min(100, (totalDays.size / 5) * 100);
        let efMes = Math.min(100, (monthDays.size / 20) * 100);

        document.getElementById('efec-semanal').innerHTML = `<div class="card p-3 bg-white border-start border-primary border-4 shadow-sm text-center"><small class="fw-bold text-muted">EFECTIVIDAD SEMANAL</small><h2 class="fw-bold mb-0">${efSem.toFixed(0)}%</h2><small>${totalDays.size} de 5 días</small></div>`;
        document.getElementById('efec-mensual').innerHTML = `<div class="card p-3 bg-white border-start border-success border-4 shadow-sm text-center"><small class="fw-bold text-muted">EFECTIVIDAD MENSUAL</small><h2 class="fw-bold mb-0 text-success">${efMes.toFixed(0)}%</h2><small>${monthDays.size} de 20 días laborales</small></div>`;

        // Tarjetas
        const container = document.getElementById('container-diario');
        container.innerHTML = '';
        Object.keys(dailyGroup).reverse().forEach(dia => {
            let d = dailyGroup[dia];
            container.innerHTML += `<div class="card mb-3 border-0 shadow-sm"><div class="card-header bg-white py-2 border-bottom d-flex justify-content-between align-items-center"><h6 class="m-0 fw-bold text-primary small">📅 ${dia}</h6><div class="d-flex gap-1"><span class="badge bg-success small">ING: ${d.ing}</span><span class="badge bg-danger small">RECH: ${d.rech}</span></div></div><div class="card-body p-0"><table class="table table-sm m-0" style="font-size: 0.8rem;"><tbody>${d.items.map(it => `<tr><td width="40%">${it.cat}</td><td width="30%"><b>${it.pat}</b></td><td width="30%">${it.nota || '-'}</td></tr>`).join('')}</tbody></table></div></div>`;
        });
    }

    document.getElementById('tallerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        document.getElementById('loading').style.display = 'flex';
        let rechazos = [];
        document.querySelectorAll('.rechazo-row').forEach(row => {
            let p = row.querySelector('.rechazo-patente').value.trim();
            let m = row.querySelector('.rechazo-motivo').value.trim();
            if(p) rechazos.push({patente: p.toUpperCase(), motivo: m});
        });

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify({
                fecha: document.getElementById('fecha').value,
                ingresos: document.getElementById('ingresos').value,
                pendientes: document.getElementById('pendientes').value,
                retiros: document.getElementById('retiros').value,
                entregas: document.getElementById('entregas').value,
                rechazosArray: rechazos
            })
        }).then(() => {
            document.getElementById('loading').style.display = 'none';
            alert("✅ reporte enviado con éxito");
            location.reload();
        });
    });
</script>
</body>
</html>
