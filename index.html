<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión Taller Profesional - V5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; }
        body { background-color: var(--bg); font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 15px; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .loading { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); z-index:9999; justify-content:center; align-items:center; flex-direction:column; }
        .nav-link { cursor: pointer; font-weight: 600; color: #5f6368; }
        .nav-link.active { color: var(--primary) !important; border-bottom: 3px solid var(--primary); border-radius: 0; }
        .badge-cat { font-size: 0.75rem; text-transform: uppercase; }
    </style>
</head>
<body>

<div id="loading" class="loading">
    <div class="spinner-grow text-primary"></div>
    <h5 class="mt-3">Sincronizando reporte...</h5>
</div>

<div class="container py-4">
    <h2 class="text-center fw-bold mb-4 text-primary">DASHBOARD DE MOVIMIENTOS</h2>

    <ul class="nav nav-justified mb-4 bg-white p-2 rounded-pill shadow-sm">
        <li class="nav-item"><a class="nav-link active" id="tab-reg" onclick="showTab('form')">📝 REGISTRO</a></li>
        <li class="nav-item"><a class="nav-link" id="tab-stat" onclick="showTab('stats')">📊 Estadísticas de movimientos</a></li>
    </ul>

    <div id="view-form">
        <div class="card p-4 mx-auto" style="max-width: 650px;">
            <form id="tallerForm">
                <div class="mb-3">
                    <label class="form-label fw-bold">FECHA DEL REPORTE</label>
                    <input type="date" id="fecha" class="form-control" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label fw-bold text-success">🟢 INGRESOS A TALLER</label>
                    <textarea id="ingresos" class="form-control" rows="2" placeholder="Ingrese patentes separadas por espacio..."></textarea>
                </div>

                <div class="p-3 bg-light rounded mb-3 border-start border-danger border-4">
                    <label class="form-label fw-bold text-danger">🚫 RECHAZOS</label>
                    <div id="rechazosContainer">
                        <div class="row g-2 mb-2">
                            <div class="col-6"><input type="text" class="form-control rechazo-patente" placeholder="Patente"></div>
                            <div class="col-6"><input type="text" class="form-control rechazo-motivo" placeholder="Motivo"></div>
                        </div>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-danger w-100" onclick="addRechazo()">+ Agregar otro rechazo</button>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-info">⌛ PENDIENTES DE INGRESO</label>
                    <textarea id="pendientes" class="form-control" rows="1"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold text-warning">🔧 RETIRADAS DE TALLER</label>
                    <textarea id="retiros" class="form-control" rows="1"></textarea>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold text-primary">🚚 ENTREGADAS A LOGISTICA</label>
                    <textarea id="entregas" class="form-control" rows="1"></textarea>
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold shadow">ENVIAR REPORTE DE MOVIMIENTOS 🚀</button>
            </form>
        </div>
    </div>

    <div id="view-stats" style="display:none;">
        <div id="efectividad-header"></div>
        <div id="container-diario"></div>
    </div>
</div>

<script>
    // URL DE TU IMPLEMENTACIÓN VERSIÓN 5
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxrax2C3Iz-1kotxmv4SR3tZ74gLvaqIXrnQC_fbH42cFYWV28YjyNU7w53tF5FQW4O3w/exec";

    document.getElementById('fecha').valueAsDate = new Date();

    function addRechazo() {
        const div = document.createElement('div');
        div.className = 'row g-2 mb-2';
        div.innerHTML = '<div class="col-6"><input type="text" class="form-control rechazo-patente" placeholder="Patente"></div><div class="col-6"><input type="text" class="form-control rechazo-motivo" placeholder="Motivo"></div>';
        document.getElementById('rechazosContainer').appendChild(div);
    }

    function showTab(tab) {
        document.getElementById('view-form').style.display = tab === 'form' ? 'block' : 'none';
        document.getElementById('view-stats').style.display = tab === 'stats' ? 'block' : 'none';
        document.getElementById('tab-reg').classList.toggle('active', tab === 'form');
        document.getElementById('tab-stat').classList.toggle('active', tab === 'stats');
        if(tab === 'stats') loadData();
    }

    function loadData() {
        document.getElementById('loading').style.display = 'flex';
        fetch(SCRIPT_URL).then(r => r.json()).then(rows => {
            renderStats(rows);
            document.getElementById('loading').style.display = 'none';
        }).catch(() => {
            document.getElementById('loading').style.display = 'none';
            alert("Error al cargar estadísticas.");
        });
    }

    function renderStats(rows) {
        const container = document.getElementById('container-diario');
        container.innerHTML = '';
        let daily = {};
        let totalDays = new Set();

        // Agrupar datos por fecha (saltando el encabezado del Excel)
        for(let i=1; i<rows.length; i++){
            let [f, cat, pat, nota] = rows[i];
            if(!f) continue;
            let dateStr = new Date(f).toLocaleDateString();
            totalDays.add(dateStr);
            
            if(!daily[dateStr]) daily[dateStr] = {ing:0, rech:0, log:0, items:[]};
            
            if(cat === "INGRESOS A TALLER") daily[dateStr].ing++;
            if(cat === "RECHAZOS") daily[dateStr].rech++;
            if(cat === "ENTREGADAS A LOGISTICA") daily[dateStr].log++;
            
            daily[dateStr].items.push({cat, pat, nota});
        }

        // Cálculo de Efectividad (Semana laboral de 5 días)
        let efec = Math.min(100, (totalDays.size / 5) * 100);
        document.getElementById('efectividad-header').innerHTML = `
            <div class="card p-4 mb-4 bg-dark text-white text-center shadow">
                <h6 class="text-uppercase mb-1" style="letter-spacing: 2px;">Efectividad del responsable</h6>
                <h1 class="display-4 fw-bold mb-0">${efec.toFixed(0)}%</h1>
                <p class="small mb-0 mt-2">Reportes enviados: ${totalDays.size} de 5 días laborales esta semana</p>
            </div>`;

        // Crear tarjetas por cada día
        Object.keys(daily).reverse().forEach(dia => {
            let d = daily[dia];
            let html = `
                <div class="card mb-4 overflow-hidden border-0 shadow-sm">
                    <div class="card-header bg-primary text-white py-3">
                        <div class="d-flex justify-content-between align-items-center">
                            <h6 class="m-0 fw-bold">📅 REPORTE: ${dia}</h6>
                            <div>
                                <span class="badge bg-light text-dark">ING: ${d.ing}</span>
                                <span class="badge bg-danger">RECH: ${d.rech}</span>
                                <span class="badge bg-info text-dark">LOG: ${d.log}</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <table class="table table-hover m-0">
                            <thead class="table-light">
                                <tr>
                                    <th style="font-size: 0.8rem;">CATEGORÍA</th>
                                    <th style="font-size: 0.8rem;">PATENTE</th>
                                    <th style="font-size: 0.8rem;">MOTIVO / NOTA</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${d.items.map(it => `
                                    <tr>
                                        <td><span class="badge-cat fw-bold text-muted">${it.cat}</span></td>
                                        <td><span class="badge border text-primary fw-bold">${it.pat}</span></td>
                                        <td><small class="text-secondary">${it.nota || '-'}</small></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
            container.innerHTML += html;
        });
    }

    document.getElementById('tallerForm').addEventListener('submit', function(e) {
        e.preventDefault();
        document.getElementById('loading').style.display = 'flex';
        
        let rechazos = [];
        document.querySelectorAll('.rechazo-patente').forEach((p, i) => {
            if(p.value.trim()) {
                rechazos.push({
                    patente: p.value.trim(), 
                    motivo: document.querySelectorAll('.rechazo-motivo')[i].value.trim() || "S/M"
                });
            }
        });

        const payload = {
            fecha: document.getElementById('fecha').value,
            ingresos: document.getElementById('ingresos').value,
            pendientes: document.getElementById('pendientes').value,
            retiros: document.getElementById('retiros').value,
            entregas: document.getElementById('entregas').value,
            rechazosArray: rechazos
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            body: JSON.stringify(payload)
        }).then(() => {
            document.getElementById('loading').style.display = 'none';
            alert("✅ reporte enviado con éxito");
            location.reload();
        }).catch(() => {
            document.getElementById('loading').style.display = 'none';
            alert("❌ Error de conexión al servidor");
        });
    });
</script>
</body>
</html>
